<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2960;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad5)"/>

  <!-- Decorative elements -->
  <polygon points="100,200 140,250 60,250" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.2"/>
  <rect x="650" y="400" width="100" height="100" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.15"/>

  <!-- Main icon -->
  <g filter="url(#glow5)">
    <!-- Price tag -->
    <path d="M 250 180 L 500 180 L 520 220 L 500 260 L 250 260 Z" fill="none" stroke="url(#accentGrad5)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Dollar sign -->
    <text x="375" y="320" font-size="120" font-weight="bold" fill="url(#accentGrad5)" text-anchor="middle" font-family="Arial">$</text>

    <!-- Optimization lines -->
    <line x1="300" y1="380" x2="500" y2="380" stroke="#f093fb" stroke-width="4" opacity="0.6"/>
    <line x1="300" y1="410" x2="480" y2="410" stroke="#f093fb" stroke-width="4" opacity="0.6"/>
    <line x1="300" y1="440" x2="460" y2="440" stroke="#f093fb" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="400" y="500" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">PRICE OPTIMIZATION</text>
  <text x="400" y="550" font-size="24" fill="#f5576c" text-anchor="middle" font-family="Arial">Bayesian Strategy</text>
</svg>