<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4e1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7fff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32cd32;stop-opacity:1" />
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad9)"/>

  <!-- Decorative elements -->
  <polygon points="140,80 170,140 110,140" fill="none" stroke="#7fff00" stroke-width="2" opacity="0.2"/>
  <rect x="620" y="420" width="120" height="120" fill="none" stroke="#7fff00" stroke-width="2" opacity="0.15" transform="rotate(45 680 480)"/>

  <!-- Focus target/crosshair -->
  <g filter="url(#glow9)">
    <!-- Outer circle -->
    <circle cx="400" cy="300" r="80" fill="none" stroke="url(#accentGrad9)" stroke-width="6"/>

    <!-- Middle circle -->
    <circle cx="400" cy="300" r="55" fill="none" stroke="url(#accentGrad9)" stroke-width="4" opacity="0.8"/>

    <!-- Inner dot -->
    <circle cx="400" cy="300" r="15" fill="url(#accentGrad9)"/>

    <!-- Crosshair lines -->
    <line x1="320" y1="300" x2="360" y2="300" stroke="url(#accentGrad9)" stroke-width="3" stroke-linecap="round"/>
    <line x1="440" y1="300" x2="480" y2="300" stroke="url(#accentGrad9)" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="220" x2="400" y2="260" stroke="url(#accentGrad9)" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="340" x2="400" y2="380" stroke="url(#accentGrad9)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Focus rays -->
  <g filter="url(#glow9)" opacity="0.6">
    <line x1="280" y1="180" x2="320" y2="240" stroke="#7fff00" stroke-width="2" stroke-linecap="round"/>
    <line x1="480" y1="180" x2="440" y2="240" stroke="#7fff00" stroke-width="2" stroke-linecap="round"/>
    <line x1="280" y1="420" x2="320" y2="360" stroke="#7fff00" stroke-width="2" stroke-linecap="round"/>
    <line x1="480" y1="420" x2="440" y2="360" stroke="#7fff00" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="400" y="495" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">ATTENTIO</text>
  <text x="400" y="540" font-size="22" fill="#7fff00" text-anchor="middle" font-family="Arial">Focus Assistant</text>
</svg>
