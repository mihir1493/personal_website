<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4d6d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Background circles -->
  <circle cx="200" cy="150" r="60" fill="none" stroke="#43e97b" stroke-width="2" opacity="0.2"/>
  <circle cx="600" cy="500" r="90" fill="none" stroke="#fa709a" stroke-width="2" opacity="0.15"/>

  <!-- A/B Test beakers -->
  <g filter="url(#glow4)">
    <!-- Beaker A -->
    <rect x="220" y="180" width="80" height="120" rx="5" fill="none" stroke="url(#accentGradA)" stroke-width="6"/>
    <line x1="220" y1="220" x2="300" y2="220" stroke="url(#accentGradA)" stroke-width="4"/>
    <rect x="255" y="140" width="10" height="40" fill="url(#accentGradA)"/>
    <text x="260" y="310" font-size="32" font-weight="bold" fill="#43e97b" text-anchor="middle" font-family="Arial">A</text>

    <!-- Beaker B -->
    <rect x="500" y="180" width="80" height="120" rx="5" fill="none" stroke="url(#accentGradB)" stroke-width="6"/>
    <line x1="500" y1="220" x2="580" y2="220" stroke="url(#accentGradB)" stroke-width="4"/>
    <rect x="535" y="140" width="10" height="40" fill="url(#accentGradB)"/>
    <text x="540" y="310" font-size="32" font-weight="bold" fill="#fa709a" text-anchor="middle" font-family="Arial">B</text>

    <!-- VS in middle -->
    <text x="400" y="260" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">VS</text>
  </g>

  <!-- Text -->
  <text x="400" y="480" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">AB TESTING</text>
  <text x="400" y="530" font-size="24" fill="#43e97b" text-anchor="middle" font-family="Arial">Experimentation Framework</text>
</svg>