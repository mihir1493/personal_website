<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad2)"/>

  <!-- Background elements -->
  <circle cx="100" cy="120" r="70" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.2"/>
  <circle cx="700" cy="450" r="100" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.15"/>

  <!-- Forecast graph -->
  <g filter="url(#glow2)">
    <!-- Graph lines -->
    <line x1="200" y1="250" x2="600" y2="250" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="150" x2="200" y2="350" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>

    <!-- Prediction curve -->
    <path d="M 250 280 Q 350 200 450 240 T 600 200" fill="none" stroke="url(#accentGrad2)" stroke-width="6" stroke-linecap="round"/>

    <!-- Data points -->
    <circle cx="250" cy="280" r="8" fill="url(#accentGrad2)"/>
    <circle cx="350" cy="200" r="8" fill="url(#accentGrad2)"/>
    <circle cx="450" cy="240" r="8" fill="url(#accentGrad2)"/>
    <circle cx="550" cy="210" r="8" fill="url(#accentGrad2)"/>
    <circle cx="600" cy="200" r="8" fill="url(#accentGrad2)"/>
  </g>

  <!-- Text -->
  <text x="400" y="480" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">DROUGHT PREDICTION</text>
  <text x="400" y="530" font-size="24" fill="#00d4ff" text-anchor="middle" font-family="Arial">Forecasting Pipeline</text>
</svg>