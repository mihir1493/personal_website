<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad3)"/>

  <!-- Decorative elements -->
  <polygon points="150,80 180,140 120,140" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>
  <rect x="600" y="420" width="120" height="120" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.15" transform="rotate(45 660 480)"/>

  <!-- Main icon -->
  <g filter="url(#glow3)">
    <!-- Play button -->
    <rect x="280" y="200" width="240" height="240" rx="20" fill="none" stroke="url(#accentGrad3)" stroke-width="8"/>

    <!-- Play triangle -->
    <polygon points="400,280 400,520 560,400" fill="url(#accentGrad3)"/>
  </g>

  <!-- Nest symbol -->
  <g filter="url(#glow3)" opacity="0.8">
    <circle cx="350" cy="280" r="30" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="350" cy="280" r="20" fill="none" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="400" y="480" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">TUBENEST</text>
  <text x="400" y="530" font-size="24" fill="#00f2fe" text-anchor="middle" font-family="Arial">AI Chrome Extension</text>
</svg>