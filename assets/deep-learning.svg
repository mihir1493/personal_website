<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1525;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2240;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099bb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad6)"/>

  <!-- Decorative rings -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.15"/>
  <circle cx="680" cy="460" r="100" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.1"/>

  <!-- Neural network diagram -->
  <g filter="url(#glow6)">

    <!-- Connections: input to hidden1 -->
    <line x1="200" y1="120" x2="340" y2="90"  stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="120" x2="340" y2="165" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="120" x2="340" y2="240" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="200" x2="340" y2="90"  stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="200" x2="340" y2="165" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="200" x2="340" y2="240" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="200" x2="340" y2="315" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="280" x2="340" y2="165" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="280" x2="340" y2="240" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="200" y1="280" x2="340" y2="315" stroke="#00d4ff" stroke-width="1.5" opacity="0.35"/>

    <!-- Connections: hidden1 to hidden2 -->
    <line x1="340" y1="90"  x2="480" y2="130" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="90"  x2="480" y2="210" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="165" x2="480" y2="130" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="165" x2="480" y2="210" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="165" x2="480" y2="290" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="240" x2="480" y2="210" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="240" x2="480" y2="290" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="315" x2="480" y2="210" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="315" x2="480" y2="290" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>

    <!-- Connections: hidden2 to output -->
    <line x1="480" y1="130" x2="600" y2="170" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
    <line x1="480" y1="130" x2="600" y2="250" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
    <line x1="480" y1="210" x2="600" y2="170" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
    <line x1="480" y1="210" x2="600" y2="250" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
    <line x1="480" y1="290" x2="600" y2="170" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
    <line x1="480" y1="290" x2="600" y2="250" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>

    <!-- Input nodes -->
    <circle cx="200" cy="120" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="200" cy="200" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="200" cy="280" r="14" fill="url(#nodeGrad6)"/>

    <!-- Hidden layer 1 nodes -->
    <circle cx="340" cy="90"  r="14" fill="url(#nodeGrad6)"/>
    <circle cx="340" cy="165" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="340" cy="240" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="340" cy="315" r="14" fill="url(#nodeGrad6)"/>

    <!-- Hidden layer 2 nodes -->
    <circle cx="480" cy="130" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="480" cy="210" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="480" cy="290" r="14" fill="url(#nodeGrad6)"/>

    <!-- Output nodes -->
    <circle cx="600" cy="170" r="14" fill="url(#nodeGrad6)"/>
    <circle cx="600" cy="250" r="14" fill="url(#nodeGrad6)"/>

  </g>

  <!-- Text -->
  <text x="400" y="450" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">DEEP LEARNING</text>
  <text x="400" y="500" font-size="26" fill="#00d4ff" text-anchor="middle" font-family="Arial">Neural Networks &amp; RNN</text>
</svg>
