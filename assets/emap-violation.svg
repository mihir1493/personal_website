<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b5b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8a7f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad1)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="80" fill="none" stroke="#ff6b5b" stroke-width="2" opacity="0.2"/>
  <circle cx="650" cy="500" r="120" fill="none" stroke="#ff6b5b" stroke-width="2" opacity="0.15"/>

  <!-- Main icon -->
  <g filter="url(#glow1)">
    <!-- Magnifying glass -->
    <circle cx="400" cy="300" r="80" fill="none" stroke="url(#accentGrad1)" stroke-width="8"/>
    <line x1="470" y1="370" x2="530" y2="430" stroke="url(#accentGrad1)" stroke-width="8" stroke-linecap="round"/>

    <!-- Warning symbol inside -->
    <text x="400" y="330" font-size="80" font-weight="bold" fill="#ff6b5b" text-anchor="middle" font-family="Arial">!</text>
  </g>

  <!-- Text -->
  <text x="400" y="480" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">EMAP VIOLATION</text>
  <text x="400" y="530" font-size="24" fill="#ff8a7f" text-anchor="middle" font-family="Arial">3P Detection System</text>
</svg>