<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Mihir Shinde</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .blog-section {
            padding: 100px 0;
            background-color: var(--color-secondary);
            min-height: calc(100vh - 80px);
        }

        .blog-header {
            margin-bottom: 60px;
            text-align: center;
        }

        .blog-header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 20px;
        }

        .blog-header p {
            font-size: 1.2rem;
            color: var(--color-text-secondary);
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .article-card {
            background: var(--color-primary);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .article-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .article-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            overflow: hidden;
            position: relative;
        }

        .article-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            opacity: 0.9;
            z-index: 1;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        /* Liquid color variations for each article */
        .article-card:nth-child(1) .article-image,
        .article-card:nth-child(1) .article-image::before {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }

        .article-card:nth-child(2) .article-image,
        .article-card:nth-child(2) .article-image::before {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .article-card:nth-child(3) .article-image,
        .article-card:nth-child(3) .article-image::before {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .article-card:nth-child(4) .article-image,
        .article-card:nth-child(4) .article-image::before {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }

        .article-card:nth-child(5) .article-image,
        .article-card:nth-child(5) .article-image::before {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .article-card:nth-child(6) .article-image,
        .article-card:nth-child(6) .article-image::before {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
        }

        .article-card:nth-child(n+7) .article-image,
        .article-card:nth-child(n+7) .article-image::before {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }

        .article-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .article-date {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 10px;
        }

        .article-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 12px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .article-description {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            margin-bottom: 15px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            color: #00f2fe;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .read-more:hover {
            color: #4facfe;
            transform: translateX(5px);
        }

        .article-card:nth-child(2) .read-more {
            color: #43e97b;
        }

        .article-card:nth-child(2) .read-more:hover {
            color: #38f9d7;
        }

        .article-card:nth-child(3) .read-more {
            color: #fa709a;
        }

        .article-card:nth-child(3) .read-more:hover {
            color: #fee140;
        }

        .article-card:nth-child(4) .read-more {
            color: #30cfd0;
        }

        .article-card:nth-child(4) .read-more:hover {
            color: #330867;
        }

        .article-card:nth-child(5) .read-more {
            color: #a8edea;
        }

        .article-card:nth-child(5) .read-more:hover {
            color: #fed6e3;
        }

        .article-card:nth-child(6) .read-more {
            color: #ff9a56;
        }

        .article-card:nth-child(6) .read-more:hover {
            color: #ff6a88;
        }

        .read-more::after {
            content: '→';
            margin-left: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: var(--color-text-secondary);
        }

        .error {
            background-color: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 20px;
            color: #ff6b6b;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .blog-header h1 {
                font-size: 2rem;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .blog-section {
                padding: 50px 0;
            }
        }
    </style>
</head>
